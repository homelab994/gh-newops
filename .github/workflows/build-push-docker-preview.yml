name: Deploy k8s preview

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number to build'
        required: true
        type: string
      artifact-name:
        description: 'Artifact name'
        type: string
        required: true
    outputs:
      preview-version:
        description: 'Preview version'
        value: ${{ jobs.build-image-preview.outputs.preview-version }}

permissions:
  contents: read
  pull-requests: read

jobs:
  build-image-preview:
    runs-on: ubuntu-latest
    outputs:
      preview-version: ${{ steps.preview-version.outputs.preview-version }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: homelab994
          repositories: gh-newops

      - name: Get PR information
        id: pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_DATA=$(gh pr view ${{ inputs.pr_number }} \
            --repo ${{ github.repository_owner }}/${{ inputs.artifact-name }} \
            --json headRefName,headRefOid,headRepository)
          
          echo "$PR_DATA"
          
          HEAD_BRANCH=$(echo "$PR_DATA" | jq -r '.headRefName')
          HEAD_SHA=$(echo "$PR_DATA" | jq -r '.headRefOid')
          HEAD_REPO=$(echo "$PR_DATA" | jq -r '.headRepository.nameWithOwner')
          
          echo "branch=$HEAD_BRANCH" >> $GITHUB_OUTPUT
          echo "sha=$HEAD_SHA" >> $GITHUB_OUTPUT
          echo "repo=$HEAD_REPO" >> $GITHUB_OUTPUT

      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Get preview-version version
        id: preview-version
        run: |
          PREVIEW_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "preview-version=$PREVIEW_VERSION" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/${{ inputs.artifact-name }}:${{ steps.preview-version.outputs.preview-version }} .

      - name: Push Docker image
        run: docker push ${{ vars.DOCKERHUB_USERNAME }}/${{ inputs.artifact-name }}:${{ steps.preview-version.outputs.preview-version }}
