name: Promote artifacts

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options:
          - DEV
          - INT
          - PREPROD
          - PROD
        required: true
      target:
        description: 'Specify host or all'
        type: choice
        options:
          - All
          - Primary
          - Backup
          - Standalone
        required: true

concurrency:
  group: promote-artifacts-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  prepare-promote:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.extract-services.outputs.services }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: homelab994/gh-newops
          token: ${{ steps.app-token.outputs.token }}
          ref: develop

      - name: Validate promote state
        run: |
          PROMOTE_FILE="promotes/promote-${{ inputs.environment }}.json"
          
          if [ ! -f "$PROMOTE_FILE" ]; then
            echo "Promote file not found: $PROMOTE_FILE"
            exit 1
          fi
          
          REVIEWED=$(jq -r '.metadata.reviewed' $PROMOTE_FILE)
          
          if [ "$REVIEWED" != "true" ]; then
            echo "Promotion not reviewed yet."
            exit 1
          fi
      - name: Extract services
        id: extract-services
        run: |
          PROMOTE_FILE="promotes/promote-${{ inputs.environment }}.json"
      
          SERVICES=$(jq -c '
            .services
            | to_entries
            | map({
                svc: .key,
                ver: .value
              })
          ' "$PROMOTE_FILE")
      
          echo "services=$SERVICES" >> $GITHUB_OUTPUT

  deploy:
    needs: prepare-promote
    strategy:
      max-parallel: 1
      matrix:
        service: ${{ fromJson(needs.prepare-promote.outputs.services) }}
    uses: ./.github/workflows/deploy-artifact.yml
    with:
      artifact-name: ${{ matrix.service.svc }}
      release-version: ${{ matrix.service.ver }}
      environment: ${{ inputs.environment }}
      target: ${{ inputs.target }}
    secrets: inherit

  finalize:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: homelab994/gh-newops
          token: ${{ steps.app-token.outputs.token }}
          ref: develop

      - name: Update promoted metadata
        run: |
          PROMOTE_FILE="promotes/promote-${{ inputs.environment }}.json"
          TARGETS=("${{ inputs.target }}")
          
          for TARGET in "${TARGETS[@]}"; do
            jq --arg target "$TARGET" '
              .metadata.promoted =
                (
                  (.metadata.promoted // []) as $existing
                  |
                  if ($existing | index($target))
                  then $existing
                  else $existing + [$target]
                  end
                )
            ' "$PROMOTE_FILE" > tmp.json
          
            mv tmp.json "$PROMOTE_FILE"
          done

      - name: Commit promoted metadata
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add promotes/promote-${{ inputs.environment }}.json
          
          if git diff --cached --quiet; then
            echo "No metadata changes."
            exit 0
          fi
          
          git commit -m "[PROMOTION] ${{ inputs.environment }} -> ${{ inputs.target }}"
          git push origin develop