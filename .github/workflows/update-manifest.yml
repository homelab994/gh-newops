name: Update Environment Manifest

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Artifact name'
        type: string
        required: true
      release-version:
        description: 'Release version'
        type: string
        required: true
      environment:
        description: 'Target environment'
        type: string
        required: true

concurrency:
  group: update-manifest-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: homelab994
          repositories: gh-newops

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: homelab994/gh-newops
          token: ${{ steps.app-token.outputs.token }}
          ref: develop

      - name: Update manifest
        run: |
          FILE="vm-manifests/${{ inputs.environment }}.json"
          SERVICE="${{ inputs.artifact-name }}"
          VERSION="${{ inputs.release-version }}"
          
          jq --arg svc "$SERVICE" \
             --arg ver "$VERSION" \
             '.[$svc]=$ver' $FILE > tmp.json
          
          mv tmp.json $FILE

      - name: Commit and push changes
        run: |    
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add vm-manifests/${{ inputs.environment }}.json
          
          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi
    
          git commit -m "Update ${{ inputs.artifact-name }} to ${{ inputs.release-version }} in ${{ inputs.environment }}"
          git push origin develop