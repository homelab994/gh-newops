name: Update Environment Manifest

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Artifact name'
        type: string
        required: true
      release-version:
        description: 'Release version'
        type: string
        required: true
      environment:
        description: 'Target environment'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      artifact-name:
        description: 'Artifact name'
        type: string
        required: true
      release-version:
        description: 'Release version'
        type: string
        required: true
      environment:
        description: 'Target environment'
        type: choice
        options:
          - dev
          - int
          - preprod
          - prod
        
concurrency:
  group: manifest-${{ steps.resolve-inputs.outputs.environment }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve inputs
        id: resolve-inputs
        run: |
          echo "artifact-name=${{ inputs.artifact-name || github.event.inputs.artifact-name }}" >> $GITHUB_OUTPUT
          echo "release-version=${{ inputs.release-version || github.event.inputs.release-version }}" >> $GITHUB_OUTPUT
          echo "environment=${{ inputs.environment || github.event.inputs.environment }}" >> $GITHUB_OUTPUT

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Update manifest
        run: |
          FILE="vm-manifests/${{ steps.resolve-inputs.outputs.environment }}.json"
          SERVICE="${{ steps.resolve-inputs.outputs.artifact-name }}"
          VERSION="${{ steps.resolve-inputs.outputs.release-version }}"
          
          jq --arg svc "$SERVICE" \
             --arg ver "$VERSION" \
             '.[$svc]=$ver' $FILE > tmp.json
          
          mv tmp.json $FILE

      - name: Commit and push changes
        run: |    
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          git add vm-manifests/${{ steps.resolve-inputs.outputs.environment }}.json
          
          if git diff --cached --quiet; then
            echo "No changes detected. Skipping commit."
            exit 0
          fi
    
          git commit -m "Update ${{ steps.resolve-inputs.outputs.artifact-name }} to ${{ steps.resolve-inputs.outputs.release-version }} in ${{ steps.resolve-inputs.outputs.environment }}"
          git push origin develop