name: Deploy artifact dispatch

on:
  workflow_dispatch:
    inputs:
      artifact-name:
        description: 'Artifact name'
        type: choice
        options:
          - another-service
          - gh-simple-spring
          - inexistent-service
        required: true
      release-version:
        description: 'Release version'
        type: string
        required: true
      environment:
        description: 'Target environment'
        type: choice
        options:
          - DEV
          - INT
          - PREPROD
          - PROD
        required: true
      target:
        description: 'Specify host or all'
        type: choice
        options:
          - All
          - Primary
          - Backup
          - Standalone
        required: true

concurrency:
  group: deploy-artifact-${{ github.event.inputs.artifact-name }}-env-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.hosts-list.outputs.hosts }}
      hosts-empty: ${{ steps.hosts-list.outputs.hosts-empty }}
    steps:
      - id: hosts-list
        run: |
          ENV="${{ github.event.inputs.environment }}"
          TARGET="${{ github.event.inputs.target }}"

          case "$ENV" in
            DEV)
              PRIMARY='["dev1.company.com"]'
              BACKUP='[]'
              STANDALONE='[]'
              ;;
            INT)
              PRIMARY='["int1.company.com"]'
              BACKUP='["int2.company.com"]'
              STANDALONE='[]'
              ;;
            PREPROD)
              PRIMARY='["preprod1.company.com"]'
              BACKUP='["preprod2.company.com"]'
              STANDALONE='["preprod3.company.com"]'
              ;;
            PROD)
              PRIMARY='["prod1.company.com"]'
              BACKUP='["prod2.company.com"]'
              STANDALONE='["prod3.company.com"]'
              ;;
          esac
          
          if [ "$TARGET" = "Primary" ]; then
            HOSTS=$PRIMARY
          elif [ "$TARGET" = "Backup" ]; then
            HOSTS=$BACKUP
          elif [ "$TARGET" = "Standalone" ]; then
            HOSTS=$STANDALONE
          else
            HOSTS=$(jq -c -n "$PRIMARY + $BACKUP")
          fi
          
          if [ "$HOSTS" = "[]" ]; then
            echo "No hosts available in environment: $ENV for selection: $TARGET"
            echo "hosts-empty=true" >> $GITHUB_OUTPUT
          else
            echo "hosts-empty=false" >> $GITHUB_OUTPUT
          fi
          
          echo "hosts=$HOSTS" >> $GITHUB_OUTPUT

  deploy:
    needs: prepare
    if: needs.prepare.outputs.hosts-empty != 'true'
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    strategy:
      max-parallel: 1
      matrix:
        host: ${{ fromJson(needs.prepare.outputs.hosts) }}

    steps:
      - name: Deploy to ${{ matrix.host }}
        run: |
          echo "HOSTS: ${{ matrix.host }}"
#        uses: appleboy/ssh-action@v1
#        with:
#          host: ${{ matrix.host }}
#          username: deploy
#          key: ${{ secrets.SSH_KEY }}
#          script: |
#            /opt/myapp/deploy.sh \
#              ${{ github.event.inputs.artifact-name }} \
#              ${{ github.event.inputs.release-version }} \
#              ${{ github.event.inputs.environment }}

  update-manifest:
    needs: [ prepare, deploy ]
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Trigger update-manifest-dispatch
        run: |
          gh workflow run update-manifest.yml \
            -R homelab994/gh-newops \
            --ref develop \
            -f artifact-name=${{ github.event.inputs.artifact-name }} \
            -f release-version=${{ github.event.inputs.release-version }} \
            -f environment=${{ github.event.inputs.environment }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
