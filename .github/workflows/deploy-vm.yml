name: Deploy vm

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 'Artifact name'
        type: string
        required: true
      release-version:
        description: 'Release version'
        type: string
        required: true
      environment:
        description: 'Target environment'
        type: string
        required: true
      target:
        description: 'Specify host or all'
        type: string
        required: false
        default: 'All'

jobs:
  prepare-vm:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.hosts-list.outputs.hosts }}
      hosts-empty: ${{ steps.hosts-list.outputs.hosts-empty }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: homelab994
          repositories: gh-newops

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: homelab994/gh-newops
          token: ${{ steps.app-token.outputs.token }}
          ref: develop

      - name: Get host list
        id: hosts-list
        run: |
          ENV="${{ inputs.environment }}"
          TARGET="${{ inputs.target }}"

          VM_HOSTS="platform/vm-hosts.yaml"

          PRIMARY=$(yq -o=json ".hosts.$ENV.primary // []" $VM_HOSTS)
          BACKUP=$(yq -o=json ".hosts.$ENV.backup // []" $VM_HOSTS)
          STANDALONE=$(yq -o=json ".hosts.$ENV.standalone // []" $VM_HOSTS)

          if [ "$TARGET" = "Primary" ]; then
            HOSTS=$PRIMARY
          elif [ "$TARGET" = "Backup" ]; then
            HOSTS=$BACKUP
          elif [ "$TARGET" = "Standalone" ]; then
            HOSTS=$STANDALONE
          else
            HOSTS=$(jq -c -n "$PRIMARY + $BACKUP")
          fi

          if [ "$HOSTS" = "[]" ]; then
            echo "No hosts available in environment: $ENV for selection: $TARGET"
            echo "hosts-empty=true" >> $GITHUB_OUTPUT
          else
            echo "hosts-empty=false" >> $GITHUB_OUTPUT
          fi

          echo "hosts=$HOSTS" >> $GITHUB_OUTPUT

  deploy-vm:
    needs: prepare-vm
    if: needs.prepare.outputs.hosts-empty != 'true'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    strategy:
      max-parallel: 1
      matrix:
        host: ${{ fromJson(needs.prepare.outputs.hosts) }}

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: homelab994
          repositories: gh-newops

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to ${{ matrix.host }}
        run: |
          echo "HOSTS: ${{ matrix.host }}"