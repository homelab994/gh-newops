apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-int
  namespace: argocd

spec:
  project: homelab994

  source:
    repoURL: https://github.com/homelab994/gh-newops
    targetRevision: HEAD
    path: clusters/homelab994/int

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true