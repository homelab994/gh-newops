apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: homelab994-int
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/homelab994/gh-newops
        revision: HEAD
        directories:
          - path: charts/*

  template:
    metadata:
      name: '{{path.basename}}-int'

    spec:
      project: homelab994

      source:
        repoURL: https://github.com/homelab994/gh-newops
        targetRevision: HEAD
        path: '{{path}}'

        helm:
          valueFiles:
            - ../../environments/int/{{path.basename}}-values.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: int

      syncPolicy:
        automated:
          prune: true
          selfHeal: true