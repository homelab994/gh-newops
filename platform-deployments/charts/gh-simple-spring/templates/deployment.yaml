apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  labels:
    app: {{ .Values.appName }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.activeProfile }}
            - name: SPRING_CONFIG_IMPORT
              value: {{ .Values.configServer }}
            - name: EUREKA_DEFAULT_ZONE
              value: {{ .Values.eurekaDefaultZone }}
            - name: SPRING_CONFIG_IMPORT
              value: >
                optional:file:/config/application-base.yml,
                optional:file:/config/application-env.yml,
                optional:file:/config/application-service.yml
          volumeMounts:
            - name: app-config
              mountPath: /config

      volumes:
        - name: app-config
          configMap:
            name: {{ .Values.appName }}-{{ .Values.activeProfile }}-config